<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undr HUD</title>
    <link rel="stylesheet" href="hud.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main container -->
    <div id="app-container" class="state-waiting">
        
        <!-- Interaction Layer for Move & Resize -->
        <div class="interaction-layer">
            <!-- Move Edges (Inside the resize edges) -->
            <div class="move-edge move-n" data-action="move"></div>
            <div class="move-edge move-s" data-action="move"></div>
            <div class="move-edge move-w" data-action="move"></div>
            <div class="move-edge move-e" data-action="move"></div>
            
            <!-- Resize Edges -->
            <div class="interact-edge edge-n" data-action="resize-n"></div>
            <div class="interact-edge edge-s" data-action="resize-s"></div>
            <div class="interact-edge edge-w" data-action="resize-w"></div>
            <div class="interact-edge edge-e" data-action="resize-e"></div>
            
            <div class="interact-edge edge-nw" data-action="resize-nw"></div>
            <div class="interact-edge edge-ne" data-action="resize-ne"></div>
            <div class="interact-edge edge-sw" data-action="resize-sw"></div>
            <div class="interact-edge edge-se" data-action="resize-se"></div>
        </div>

        <!-- Frame / Border representing the capture area -->
        <div class="capture-frame"></div>

        <!-- STATE 1: Waiting -->
        <div id="waiting-screen" class="screen">
            <div class="glass-panel main-panel">
                <h1>Consentement requis</h1>
                <p>L'assistant analysera les émotions dans ce cadre.</p>
                <button id="btn-start">Démarrer l'assistance</button>
            </div>
        </div>

        <!-- STATE 2: Active (Mini widget) -->
        <div id="active-screen" class="screen hidden">
            <!-- Invisible area that passes clicks through -->
            <div class="click-through-area" id="click-through-area"></div>
            
            <div class="mini-widget glass-panel" id="mini-widget">
                <div class="drag-handle" id="drag-handle" title="Déplacer">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg>
                </div>
                
                <div class="led-container">
                    <div class="led-group">
                        <div class="led api-led green"></div>
                        <span>API</span>
                    </div>
                    <div class="led-group">
                        <div class="led bracelet-led green"></div>
                        <span>Capteur</span>
                    </div>
                </div>

                <button id="btn-settings" class="icon-btn" title="Paramètres">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                <button id="btn-stop" class="icon-btn" title="Arrêter">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>
        <!-- Settings Modal -->
        <div id="settings-modal" class="screen hidden">
            <div class="glass-panel settings-panel">
                <h2>Paramètres</h2>
                
                <div class="settings-section">
                    <h3>Test du Bracelet</h3>
                    <div class="settings-group">
                        <label for="vibration-intensity">Puissance de vibration par défaut (<span id="intensity-val">50</span>)</label>
                        <input type="range" id="vibration-intensity" min="0" max="100" value="50">
                    </div>
                    <div class="settings-actions">
                        <button id="btn-test-severe" class="btn-test-severe">Tester Alerte Sévère</button>
                        <button id="btn-test-vigilance" class="btn-test-vigilance">Tester Vigilance</button>
                    </div>
                </div>
                
                <button id="btn-close-settings" class="btn-outline">Fermer</button>
            </div>
        </div>
    </div>

    <script src="hud.js"></script>
</body>
</html>
